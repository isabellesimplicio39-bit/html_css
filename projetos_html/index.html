<!DOCTYPE html>
<html lang="br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJETO 1</title>
</head>
<body>
    <!--form, input, checkbox, label, br, button, option, select, legend, date, text, password, fieldset, tel, email, reset, submit, method, for, id, name, placeholder, type, required.-->
<form>
    <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome_obr" name="nome" required>
        <br>
        <br>
        <label for="dataNascimento">Data de Nascimento:</label>
        <input type="date" id="data_obr" name="dataNascimento" required>
        <br>
        <br>
        <label for="email">E-mail do Aluno:</label>
        <input type="email" id="email_obr" name="email_usuario" required placeholder="aluno@exemplo.com">
        <br>
        <br>
         <label for="senha">Senha de Acesso:</label>
        <input type="password" id="senha_obr" name="senha" required placeholder="********">
        <br>
        <br>
        <label for="telefone">Telefone de Emergência:</label>
        <input type="tel" id="telefone_obr" name="telefone" required placeholder="(00) 00000-0000">
    </fieldset>
<br>
    <fieldset>
        <legend>Preferências de Estudo</legend>
        <br>
        <label for="Área de Intresse">Área de Interesse:</label>
        <br>
        <br>
       <input type="checkbox" id="front-end_obr" name="front-end" value="Front-end">
       <label for="Front-end">Front-end</label> 
       <br>
       <input type="checkbox" id="back-end_obr" name="back-end" value="Back-end">
       <label for="Back-end">Back-end</label>
        <br>
       <input type="checkbox" id="design_obr" name="design" value="Design">
       <label for="Design">Design</label>
       <br>
        <input type="checkbox" id="dados_obr" name="dados" value="Dados">
       <label for="Dados">Dados</label>
       <br>
       <br>
       <label for="como conheceu a escola">Como conheceu a escola?</label>
       <select id="como_conheceu" name="como_conheceu">
       <option value="">Selecione...</option>
       <option value="amigo">Indicação</option>
       <option value="anuncio">Anúncio</option>
       <option value="social">Redes sociais</option>
       </select><br>
    </fieldset>
    <br>
    <button type="submit">Matricular</button>
    <button type="reset">Limpar</button>
</form>
